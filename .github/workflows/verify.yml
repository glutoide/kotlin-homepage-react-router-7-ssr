name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout migration
        uses: actions/checkout@v5

      - name: Checkout supplied reference
        uses: actions/checkout@v5
        with:
          repository: JetBrains/kotlin-web-site-jetsites-internship-2026
          ref: 84328b92e50be7723b28984232caba97d0a4511e
          path: reference-project

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start supplied reference project
        run: docker compose -f reference/docker-compose.ci.yml up -d --build

      - name: Wait for supplied reference
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f reference/docker-compose.ci.yml ps
          docker compose -f reference/docker-compose.ci.yml logs --no-color
          exit 1

      - name: Verify migration against reference
        env:
          REFERENCE_BASE_URL: http://127.0.0.1:9000/
        run: npm run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Reference logs on failure
        if: failure()
        run: docker compose -f reference/docker-compose.ci.yml logs --no-color

      - name: Stop supplied reference
        if: always()
        run: docker compose -f reference/docker-compose.ci.yml down --volumes --remove-orphans

  repro-node22:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout migration
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
