name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A public fork must not run external PR code on the owner's personal laptop.
    if: >-
      github.actor == 'glutoide' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [personal-kotlin]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout migration
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Exact visual comparison to the pinned JetBrains legacy reference needs
      # Docker Linux images, unavailable on this Windows service runner.
      # Keep visual-parity as an explicit unverified gate, not a fake PASS.
      - name: Verify SSR, hydration, browser interactions, tests and security
        run: npm run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  repro-node22:
    # Public repo: never execute external PR code on an owner's home laptop.
    if: >-
      github.actor == 'glutoide' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [personal-kotlin]
    timeout-minutes: 15

    steps:
      - name: Checkout migration
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
