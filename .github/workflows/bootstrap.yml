name: bootstrap verified assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout migration
        uses: actions/checkout@v5

      - name: Checkout pinned supplied reference
        uses: actions/checkout@v5
        with:
          repository: JetBrains/kotlin-web-site-jetsites-internship-2026
          ref: 84328b92e50be7723b28984232caba97d0a4511e
          path: reference-project
          persist-credentials: false

      - name: Use exact Node.js used for final materialization
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2

      - name: Materialize lockfile and supplied assets
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit

          mkdir -p public/assets/fonts/JetBrainsMono
          for name in Regular Italic Medium Medium-Italic Bold Bold-Italic ExtraBold ExtraBold-Italic; do
            cp "reference-project/assets/fonts/JetBrainsMono/JetBrainsMono-${name}.woff2" \
              "public/assets/fonts/JetBrainsMono/JetBrainsMono-${name}.woff2"
          done

          mkdir -p public/original-assets/assets/images/index/banners
          mkdir -p public/original-assets/assets/images/index
          mkdir -p public/original-assets/assets
          mkdir -p public/original-assets/static/js/page/index/images/companies
          mkdir -p public/original-assets/static/js/page/index/images/good-for

          cp reference-project/assets/images/index/banners/kotlin-1.6.20-mobile.png public/original-assets/assets/images/index/banners/
          cp reference-project/assets/images/index/banners/kotlin-1.6.20.png public/original-assets/assets/images/index/banners/
          cp reference-project/assets/images/index/multiplatform.svg public/original-assets/assets/images/index/
          cp reference-project/assets/jetbrains-logo.svg public/original-assets/assets/

          for name in atlassian corda coursera evernote gradle spring; do
            cp "reference-project/static/js/page/index/images/companies/${name}.svg" \
              "public/original-assets/static/js/page/index/images/companies/${name}.svg"
          done
          for name in android mobile server-side web; do
            cp "reference-project/static/js/page/index/images/good-for/${name}.svg" \
              "public/original-assets/static/js/page/index/images/good-for/${name}.svg"
          done

          cp reference-project/LICENSE THIRD_PARTY_LICENSES/JetBrains-kotlin-web-site-LICENSE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public THIRD_PARTY_LICENSES/JetBrains-kotlin-web-site-LICENSE.txt
          git commit -m "chore: materialize pinned reference assets and lockfile"
          git pull --rebase origin main
          git push origin HEAD:main
